<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/cc.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- Immediate zero-flicker theme initialization -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem("theme");
          var isDark =
            saved === "dark" ||
            (!saved &&
              window.matchMedia &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          if (isDark) {
            document.documentElement.setAttribute("data-theme", "dark");
            document.documentElement.setAttribute("data-bs-theme", "dark");
          } else {
            document.documentElement.removeAttribute("data-theme");
            document.documentElement.removeAttribute("data-bs-theme");
          }
        } catch (e) {}
      })();
    </script>

    <!-- PWA Meta Tags -->
    <meta
      name="description"
      content="Event management and reporting portal for Cultural Committee"
    />
    <meta
      name="theme-color"
      content="#1f2937"
      media="(prefers-color-scheme: light)"
    />
    <meta
      name="theme-color"
      content="#1f2937"
      media="(prefers-color-scheme: dark)"
    />
    <meta name="color-scheme" content="light dark" />
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="apple-mobile-web-app-title" content="Event Management Portal - CCGNDEC" />

    <title>Event Management Portal - CCGNDEC</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
